name: skystock
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skystock
      POSTGRES_USER: skystock
      # Local development password only. The database has no published port.
      POSTGRES_PASSWORD: skystock_local_only
    volumes:
      - skystock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skystock -d skystock"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://skystock:skystock_local_only@db:5432/skystock
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
volumes:
  skystock_data:
